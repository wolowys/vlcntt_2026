services:
  postgres:
    image: postgres:16-alpine
    container_name: sensor_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sensordb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sensor_backend
    environment:
      DATABASE_URL: "host=postgres user=postgres password=postgres dbname=sensordb sslmode=disable"
      PORT: "8080"
      MQTT_BROKER: "tcp://test.mosquitto.org:1883"
      MQTT_TOPIC: "nhom13/telemetry"
      MQTT_CMD_TOPIC: "nhom13/command"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8080
    container_name: sensor_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  postgres_data:
